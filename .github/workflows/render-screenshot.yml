name: Render Arabic label screenshots

on:
  push:
    branches: [ci/screenshot]
  workflow_dispatch:

jobs:
  render:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers -productVersion

      - name: Run screenshot test
        env:
          EZDICT_SCREENSHOT_DIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Easydict.xcworkspace \
            -scheme Easydict \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:EasydictTests/MarkdownRendererTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tail -300

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: arabic-label-screenshots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: error
